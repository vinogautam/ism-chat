<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ISM Chat</title>
    <meta name="description" content="Realtime chat">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111b21">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="chat.css">
  </head>
  <body>
    <div class="chat-app">
      <header class="chat-header">
        <div class="avatar" id="peer-avatar">V</div>
        <div class="peer">
          <span class="peer-name" id="peer-name">ViKi</span>
          <span class="peer-status" id="peer-status">
            <i class="dot"></i><span id="peer-status-text">connecting…</span>
          </span>
        </div>
        <div class="header-actions">
          <span class="unread-pill" id="unread-pill" hidden>0</span>
          <button class="icon-btn" id="notif-btn" type="button" title="Notifications off" aria-label="Toggle notifications" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
          </button>
          <button class="icon-btn" id="call-btn" type="button" title="Voice call" aria-label="Voice call">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.7 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.27a2 2 0 0 1 2.11-.45c.74.34 1.53.57 2.34.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </button>
          <button class="icon-btn" id="clear" type="button" title="Clear chat" aria-label="Clear chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="messages" id="msg-container"></main>

      <button class="jump" id="jump" type="button" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
        <span id="jump-count">Latest</span>
      </button>

      <form class="composer" id="composer" autocomplete="off">
        <input id="msg" placeholder="Type a message" aria-label="Message">
        <button class="send" id="send-msg" type="submit" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15.6 12 3.4 13.8z"/>
          </svg>
        </button>
      </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/5.5.8/firebase.js"></script>
    <script src="https://www.gstatic.com/firebasejs/5.5.8/firebase-messaging.js"></script>
    <script>
      window.CHAT_CONFIG = {
        me: 2,
        peerName: "KiVi",
        pushVapidKey: "........."
      };
    </script>
    <script src="chat.js"></script>
  </body>
</html>
